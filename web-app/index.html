<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Wealth Compass — everything you own, owe, earn, and spend</title>
  <meta name="description"
    content="A local-first net-worth tracker for iPhone and Mac. Cash, investments, crypto and debts in one place, on your device. Free, no account, no tracking." />
  <meta name="author" content="Simone Mattioli" />
  <link rel="canonical" href="https://simo-hue.github.io/wealth-compass/" />

  <!-- Shows a native App Store banner at the top of the page in iOS Safari. On an
       iPhone-app landing page this is the single highest-intent placement there is,
       and it costs one tag. -->
  <meta name="apple-itunes-app" content="app-id=6777399748" />

  <!-- Matches --canvas in src/site/site.css, so the browser chrome does not flash
       a different colour than the page behind it. -->
  <meta name="theme-color" content="#16202b" />
  <meta name="color-scheme" content="dark" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Wealth Compass" />
  <meta property="og:url" content="https://simo-hue.github.io/wealth-compass/" />
  <meta property="og:title" content="Wealth Compass — everything you own, owe, earn, and spend" />
  <meta property="og:description"
    content="A local-first net-worth tracker for iPhone and Mac. Free, no account, no tracking." />
  <meta property="og:image" content="https://simo-hue.github.io/wealth-compass/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The Wealth Compass dashboard on a Mac and an iPhone." />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- The two faces used above the fold. Preloading them removes the flash of
       fallback type on the headline. The rest of the family files are fetched only
       if their unicode-range is actually needed. -->
  <link rel="preload" href="/fonts/Archivo-latin-k3kQo8.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/InstrumentSans-latin-pxiTyp.woff2" as="font" type="font/woff2" crossorigin />

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
